<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Tweet Translator</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tweet Translator</h1>
      <span class="version" id="extVersion">v...</span>
    </div>

    <div class="toggle-row">
      <span>Перевод твитов</span>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="hint">
      Клик по переведённому тексту — показать оригинал
    </div>

    <div class="author" id="_c"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
